<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barracuda Dash Settings</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a header with the connection state, a page list (side rail on wide screens, scrolling chips on phones),
   one settings page at a time. Dark first like the night dash; a light set for garage daylight. */
:root{
  --bg:#0d0e10; --panel:#16181b; --raise:#1d2024; --line:#2b2f34; --fg:#efebe1; --muted:#a39e92;
  --accent:#ee7a1c; --accent-ink:#140a02; --ok:#5ec27e; --warn:#f2c21b; --crit:#ff5446; --info:#6fa3e0;
  --chg:#ee7a1c; --chg-bg:rgba(238,122,28,.28);
  --num:Oswald,'Arial Narrow',sans-serif; --sans:Barlow,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f3f1ec; --panel:#ffffff; --raise:#f7f5f0; --line:#dcd7cc; --fg:#1b1a17; --muted:#6b665b;
  --accent:#c85d08; --accent-ink:#ffffff; --ok:#21844a; --warn:#9a7300; --crit:#c62a1d; --info:#2f67ad;
  --chg:#c85d08; --chg-bg:rgba(200,93,8,.18); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f3f1ec; --panel:#ffffff; --raise:#f7f5f0; --line:#dcd7cc; --fg:#1b1a17; --muted:#6b665b;
  --accent:#c85d08; --accent-ink:#ffffff; --ok:#21844a; --warn:#9a7300; --crit:#c62a1d; --info:#2f67ad;
  --chg:#c85d08; --chg-bg:rgba(200,93,8,.18); color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);margin:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.brand{font:500 20px/1 var(--num);letter-spacing:3px}
.brand small{display:block;font:500 11px/1.2 var(--sans);letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-top:3px}
.conn{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font:600 11px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;padding:6px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.warn{color:var(--warn);border-color:var(--warn)}.pill.crit{color:var(--crit);border-color:var(--crit)}.pill.info{color:var(--info);border-color:var(--info)}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;max-width:1180px;margin:0 auto;
  padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.pages{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px);align-self:start}
nav.pages button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500}
nav.pages button:hover{color:var(--fg);background:var(--raise)}
nav.pages button[aria-current="page"]{color:var(--fg);background:var(--raise);box-shadow:inset 3px 0 0 var(--accent)}
nav.pages button:focus-visible{outline:2px solid var(--accent)}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:12px}
  nav.pages{flex-direction:row;overflow-x:auto;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;background:var(--bg);padding-block:6px;margin-inline:-4px;scrollbar-width:none}
  nav.pages button{white-space:nowrap;padding:8px 11px}
  nav.pages button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent)}
}
main{min-width:0}
h1{font:500 26px/1.1 var(--num);letter-spacing:1px;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px;max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;min-width:0}
.card>h2{font:600 12px/1 var(--sans);letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:2px 0 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.f:first-of-type{border-top:0}
.f>label,.f>.lb{font-weight:500;flex:1 1 140px;min-width:0}
.f .hint{flex-basis:100%;color:var(--muted);font-size:13px;margin:0}
.f .ctl{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;margin-left:auto;max-width:100%}
.f.wide>.lb{flex-basis:100%}.f.wide .ctl{justify-content:flex-start;margin-left:0}
button,.btn{font:500 14px/1 var(--sans);color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:9px;min-height:38px;padding:0 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 50%,var(--line))}
button.sm{min-height:30px;padding:0 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;background:transparent;min-height:34px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
select,input[type=number],input[type=text],textarea{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;min-height:36px;padding:0 9px;font:inherit}
select{padding-right:4px;max-width:100%}
input[type=number]{width:104px;font-variant-numeric:tabular-nums}
input[type=text]{min-width:0}
textarea{width:100%;min-height:120px;padding:8px;font:12px/1.4 var(--mono)}
input[type=range]{accent-color:var(--accent);width:180px;max-width:100%}
input[type=color]{width:48px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw input:checked+span{background:var(--accent)}.sw input:checked+span::after{transform:translateX(20px);background:var(--accent-ink)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font:500 15px/1.3 var(--num);letter-spacing:.5px;font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:820px){.big{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.tile b{display:block;font:500 28px/1 var(--num);font-variant-numeric:tabular-nums}
.tile span{display:block;color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:6px}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin:8px 0 0;max-width:72ch}
.callout{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:8px;padding:10px 12px;background:var(--raise);font-size:14px;margin-bottom:14px}
.callout.warn{border-left-color:var(--warn)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11px/1 var(--sans);letter-spacing:1px;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px}
.mono{font-family:var(--mono);font-size:13px}
/* sniffer */
.sniff tr{cursor:pointer}
.sniff tr:hover td{background:var(--raise)}
.sniff tr.sel td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.bytes{display:inline-flex;gap:3px;font:13px/1 var(--mono)}
.bytes i{font-style:normal;display:inline-block;width:2.4ch;text-align:center;padding:4px 0;border-radius:4px;transition:background 1.2s,color 1.2s}
.bytes i.c{background:var(--chg-bg);color:var(--chg);transition:none}
.bytes i.quiet{opacity:.35}
.bytes i.na{opacity:.15}
.idc{font:600 13px/1 var(--mono);white-space:nowrap}
.idc small{font:500 10px/1 var(--sans);color:var(--info);margin-left:4px;letter-spacing:.5px}
.lbl{color:var(--muted);font-size:12px;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bitgrid{display:grid;grid-template-columns:auto repeat(8,minmax(0,1fr));gap:3px;font:12px/1 var(--mono);max-width:520px}
.bitgrid div{padding:6px 0;text-align:center;border-radius:4px;background:var(--raise);user-select:none}
.bitgrid .h{background:transparent;color:var(--muted)}
.bitgrid .b{cursor:pointer;border:1px solid transparent}
.bitgrid .b.on{color:var(--fg)}.bitgrid .b.off{color:var(--muted)}
.bitgrid .b.in{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--raise))}
.bitgrid .b.msb{box-shadow:inset 0 0 0 2px var(--accent)}
.bitgrid .b.c{color:var(--chg)}
canvas.chart{width:100%;height:150px;display:block;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.valbig{font:500 34px/1 var(--num);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel);border:1px solid var(--accent);color:var(--fg);border-radius:99px;padding:9px 16px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{border-color:var(--crit)}
.confirm{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.confirm.on{display:flex}
.welcome{max-width:760px}
.welcome .grid2 .card{margin:0}
ol.steps{margin:6px 0 0;padding-left:20px}ol.steps li{margin-bottom:4px}
.sigrow{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sigrow:first-of-type{border-top:0}
@media (max-width:620px){.sigrow{grid-template-columns:minmax(0,1fr) auto}.sigrow .rs{grid-column:1/-1}}
.dim{color:var(--muted)}
.ok{color:var(--ok)}.warnc{color:var(--warn)}.critc{color:var(--crit)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <div class="brand">BARRACUDA DASH<small>Gauge settings</small></div>

<script>
'use strict';
// ===================== protocol (README "Phone app protocol", protocol 2) =====================
const SVC = '6f8a0001-5c3e-4b8e-9b52-1f6d1e0a6701';
const RXC = '6f8a0002-5c3e-4b8e-9b52-1f6d1e0a6701';
const TXC = '6f8a0003-5c3e-4b8e-9b52-1f6d1e0a6701';
// replies that carry no id: matched by their type
const NOID_REPLY = { status: 'status', obdScanResults: 'scan', dtc: 'dtc', dtcIgnore: 'dtc' };

class Link {
  constructor() { this.nextId = 1; this.pending = new Map(); this.byType = []; this.listeners = new Set(); this.buf = ''; }
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); }
  feedText(s) {
    this.buf += s;
    let i;
    while ((i = this.buf.indexOf('\n')) >= 0) {
      const line = this.buf.slice(0, i).trim();
      this.buf = this.buf.slice(i + 1);
      if (!line) continue;
      let m;
      try { m = JSON.parse(line); } catch (e) { console.warn('bad line from gauge', line); continue; }
      this.dispatch(m);
    }
    if (this.buf.length > 65536) this.buf = '';
  }
  dispatch(m) {
    if (m.id != null && this.pending.has(m.id)) {
      const p = this.pending.get(m.id); this.pending.delete(m.id); clearTimeout(p.timer);
      if (m.t === 'err') p.reject(new Error(m.msg || 'error')); else p.resolve(m);
    } else if (m.t === 'err' && m.id == null && this.byType.length) {
      const p = this.byType.shift(); clearTimeout(p.timer); p.reject(new Error(m.msg || 'error'));
    } else {
      const k = this.byType.findIndex((w) => w.t === m.t);
      if (k >= 0) { const p = this.byType.splice(k, 1)[0]; clearTimeout(p.timer); p.resolve(m); }
    }
    for (const fn of this.listeners) { try { fn(m); } catch (e) { console.error(e); } }
  }
  request(op, fields, timeoutMs) {
    const t = NOID_REPLY[op];
    const msg = Object.assign({ op }, fields || {});
    return new Promise((resolve, reject) => {
      const ms = timeoutMs || 8000;
      if (t) {
        const w = { t, resolve, reject };
        w.timer = setTimeout(() => { const k = this.byType.indexOf(w); if (k >= 0) this.byType.splice(k, 1); reject(new Error('the gauge did not answer')); }, ms);
        this.byType.push(w);
      } else {
        msg.id = this.nextId++;
        const p = { resolve, reject };
        p.timer = setTimeout(() => { this.pending.delete(msg.id); reject(new Error('the gauge did not answer')); }, ms);
        this.pending.set(msg.id, p);
      }
      this.send(JSON.stringify(msg) + '\n').catch((e) => reject(e));
    });
  }
  failAll(err) {
    for (const p of this.pending.values()) { clearTimeout(p.timer); p.reject(err); }
    for (const p of this.byType) { clearTimeout(p.timer); p.reject(err); }
    this.pending.clear(); this.byType = [];
  }
}

class BleLink extends Link {
  constructor() { super(); this.kind = 'ble'; this.q = Promise.resolve(); this.dec = new TextDecoder(); }
  static available() { return !!(navigator.bluetooth && window.isSecureContext); }
  async connect(onDrop) {
    this.dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    this.dev.addEventListener('gattserverdisconnected', () => { this.failAll(new Error('disconnected')); onDrop && onDrop(); });
    const server = await this.dev.gatt.connect();
    const svc = await server.getPrimaryService(SVC);
    this.rx = await svc.getCharacteristic(RXC);
    this.tx = await svc.getCharacteristic(TXC);
    this.tx.addEventListener('characteristicvaluechanged', (e) => this.feedText(this.dec.decode(e.target.value, { stream: true })));
    await this.tx.startNotifications();
    this.name = this.dev.name || 'speedometer';
  }
  // the speedo takes one request line up to 1023 bytes, in any number of writes
  send(text) {
    const bytes = new TextEncoder().encode(text);
    this.q = this.q.then(async () => {
      for (let o = 0; o < bytes.length; o += 180) {
        const part = bytes.slice(o, o + 180);
        if (this.rx.writeValueWithResponse) await this.rx.writeValueWithResponse(part); else await this.rx.writeValue(part);
      }
    });
    return this.q;
  }
  disconnect() { try { this.dev && this.dev.gatt.disconnect(); } catch (e) {} }
}

// ===================== CAN rule maths (same as quad/can_bus.c) =====================
const SIGS = [
  { k: 'rpm', name: 'RPM', gauge: 'Tach', units: [['native', 'rpm']], src: 'srcRpm' },
  { k: 'speed', name: 'Speed', gauge: 'Speedo', units: [['native', 'mph'], ['kmh', 'km/h']], src: 'speedSrc' },
  { k: 'coolant', name: 'Coolant', gauge: 'Quad', units: [['native', '°F'], ['c', '°C']], src: 'srcCoolant' },
  { k: 'volts', name: 'Volts', gauge: 'Quad', units: [['native', 'V']], src: 'srcVolts' },
  { k: 'fuel', name: 'Fuel', gauge: 'Quad', units: [['native', '%'], ['fraction', '0 to 1']], src: 'srcFuel' },
  { k: 'oil', name: 'Oil pressure', gauge: 'Quad', units: [['native', 'psi'], ['kpa', 'kPa'], ['bar', 'bar']], src: 'srcOil' },
];
const GAUGE_UNIT = { rpm: 'rpm', speed: 'mph', coolant: '°F', volts: 'V', fuel: '%', oil: 'psi' };

function bitsOf(rule) {   // list of bit positions, most significant first
  const out = [];
  if (!rule.be) { for (let i = rule.len - 1; i >= 0; i--) out.push(rule.start + i); }
  else { let b = rule.start; for (let i = 0; i < rule.len; i++) { out.push(b); b = (b & 7) === 0 ? b + 15 : b - 1; } }
  return out;
}
function ruleFits(rule) { return bitsOf(rule).every((b) => b >= 0 && b <= 63); }
// raw value of the bits, in the rule's own unit (before conversion to the gauge unit)
function ruleRaw(rule, data) {
  if (!rule || rule.len < 1 || rule.len > 32) return null;
  if (rule.mux && (rule.mux.byte >= data.length || data[rule.mux.byte] !== rule.mux.value)) return null;
  const bits = bitsOf(rule); const n = data.length * 8;
  let raw = 0n;
  for (const b of bits) { if (b < 0 || b >= n) return null; raw = (raw << 1n) | BigInt((data[b >> 3] >> (b & 7)) & 1); }
  let v = Number(raw);
  if (rule.signed && (raw >> BigInt(rule.len - 1)) & 1n) v = v - 2 ** rule.len;
  return v * rule.scale + rule.offset;
}
function toGauge(v, unit) {
  switch (unit) { case 'kmh': return v / 1.609344; case 'c': return v * 9 / 5 + 32; case 'kpa': return v * 0.1450377;
    case 'bar': return v * 14.50377; case 'fraction': return v * 100; default: return v; }
}
function ruleDecode(rule, data) { if (!rule || !rule.on) return null; const r = ruleRaw(rule, data); return r == null ? null : toGauge(r, rule.unit); }
const hex2 = (b) => b.toString(16).toUpperCase().padStart(2, '0');
const idText = (id, ext) => ext ? id.toString(16).toUpperCase().padStart(8, '0') : id.toString(16).toUpperCase().padStart(3, '0');
const hexToBytes = (h) => { const a = []; for (let i = 0; i + 1 < h.length; i += 2) a.push(parseInt(h.substr(i, 2), 16)); return a; };
</script>
<script>
'use strict';
// ===================== settings fields (phone.c FIELDS) =====================
const FIELDS = {
  faceMode: [0, 2], dashWire: [0, 1], dayStyle: [0, 1], nightStyle: [0, 1], glow: [0, 100], fade: [0, 100],
  dayBright: [5, 100], nightBright: [5, 100], followDimmer: [0, 1], redline: [2000, 6000], rpmRunning: [100, 2000],
  oilLowPsi: [0, 80], tempHighF: [0, 260], voltsLowCv: [0, 1600], voltsHighCv: [0, 1800], fuelLowPct: [0, 50],
  fuelEmptyPct: [0, 50], speedSrc: [0, 6], pulsesPerMile: [100, 200000], creepMphX10: [0, 50], srcRpm: [0, 4],
  srcCoolant: [0, 4], srcVolts: [0, 4], srcFuel: [0, 4], srcOil: [1, 4], canOn: [0, 1], canRate: [0, 4], engGround: [0, 1],
  tachPulsesPerRevX2: [1, 24], fuelEmptyOhmX10: [0, 60000], fuelFullOhmX10: [0, 60000], oilOhm0X10: [0, 60000],
  oilOhm80X10: [0, 60000], coolOhmAX10: [1, 60000], coolTempAF: [32, 300], coolOhmBX10: [1, 60000], coolTempBF: [32, 300],
  voltsTrimCv: [-200, 200], unitsMetricSpeed: [0, 1], unitsC: [0, 1], unitsBar: [0, 1],
};
const READ_ONLY_KEYS = ['obdPaired', 'obdAddr'];

// ===================== demo gauges (no hardware): acts like the speedo firmware =====================

<script>

  return SIGS.map((g) => {

const Sniffer = {
  frames: new Map(), running: false, filter: '', onlyChg: false, sel: null, bgUntil: 0, bgEnd: 0, rec: [], timer: null, lastDraw: 0,
  labels: store.get('canLabels', {}), editor: null, hist: [],
  key(id, ext) { return (ext ? 'x' : 's') + id; },

  },
  drawBar() {

    b.innerHTML += '<button class="sm" data-act="snLearn"' + (this.running ? '' : ' disabled') + '>Learn background</button><button class="sm" data-act="snClear">Clear</button><button class="sm" data-act="snSave"' + (this.rec.length ? '' : ' disabled') + '>Save capture</button>';
  },
  async start() {
    try { await App.link.request('canSniff', { on: true }); this.running = true; this.t0 = this.t0 || performance.now(); if (this.sel) this.sendFocus(); }

  learn() { this.bgUntil = performance.now() + 5000; for (const f of this.frames.values()) { f.bg = 0; f.bgNew = false; } this.bgEnd = 0; toast('Learning for 5 seconds: change nothing'); },

          const x = (f.data[i] || 0) ^ (data[i] || 0); for (let b = 0; b < 8; b++) if (x & (1 << b)) f.bitT[i * 8 + b] = now; }

  fixVolts: () => { const r = Compare.result('volts'); const raw = r.an - App.S.voltsTrimCv / 100; const cv = Math.max(-200, Math.min(200, Math.round((r.net - raw) * 100)));
    return setKeys({ voltsTrimCv: cv }).then((ok) => ok && (Compare.hist.volts = [], render())); },
  fixCool: () => { const r = Compare.result('coolant'); const pt = r.net >= 180 ? 'coolB' : 'coolA';
    return App.link.request('senderRecord', { point: pt, tempF: Math.round(r.net) }).then(() => { toast('Coolant ' + (pt === 'coolB' ? 'hot' : 'cold') + ' point set from the car'); Compare.hist.coolant = []; return refreshSettings(); }); },
  useCan: (b) => { const [k, v] = USE_CAN[b.dataset.sig]; return setKeys({ [k]: v }).then((ok) => { if (ok) { $('#edMsg').textContent = 'Done: CAN first, the old source as backup.'; const rr = $('#ruleRows'); if (rr) rr.innerHTML = ruleRows(); } }); },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || !App.link) return;
  const f = ACT[b.dataset.act]; if (!f) return;
  e.preventDefault();
  Promise.resolve().then(() => f(b)).catch((err) => toast(err.message, true));
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.ign) App.link.request('dtcIgnore', { code: el.dataset.ign, ignore: el.checked }).then((r) => { showDtc(r); toast(el.checked ? 'Ignored' : 'Watched again'); }).catch((err) => toast(err.message, true));
});
$('#fileIn').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  try {
    const j = JSON.parse(await file.text());
    if (j.barracudaCanRules) {
      for (const r of j.rules || []) { const err = demoRuleCheck(r); if (err) throw new Error(r.sig + ': ' + err); }
      if (j.canRate != null) await App.link.request('set', { s: { canRate: j.canRate } });
      for (const r of j.rules || []) await App.link.request('set', { s: { canRules: [r] } });
      if (j.labels) { Object.assign(Sniffer.labels, j.labels); store.set('canLabels', Sniffer.labels); }
    } else if (j.barracudaDashSettings) {
      await applySettingsFile(j.settings || {});
      if (j.canLabels) { Object.assign(Sniffer.labels, j.canLabels); store.set('canLabels', Sniffer.labels); }
    } else throw new Error('this is not a Barracuda settings or rules file');
    await refreshSettings(); toast('Loaded into the gauges');
  } catch (err) { toast('Not loaded: ' + err.message, true); }
});
async function refreshSettings() { const g = await App.link.request('get'); App.S = g.s; render(); }

// ===================== connection =====================
function setPill(text, cls) { const p = $('#connPill'); p.textContent = text; p.className = 'pill ' + (cls || ''); }
function onMessage(m) {
  if (m.t === 'status') { App.st = m; Compare.onStatus(m); if (App.page === 'status' || $('[data-live]')) live(); }
  else if (m.t === 'can') Sniffer.onFrames(m.f || []);
  else if (m.t === 'scan') showScan(m);
}
async function startSession(link) {
  App.link = link; link.on(onMessage);
  App.hello = await link.request('hello', null, 90000);
  if ((App.hello.protocol || 1) < 2) toast('The gauges need a firmware update for CAN settings', true);
  const g = await link.request('get'); App.S = g.s;
  App.st = await link.request('status').catch(() => null);
  await link.request('stream', { on: true });
  const p = location.hash.slice(1);
  App.page = PAGES.some((x) => x[0] === p) ? p : 'status';
  setPill(link.kind === 'demo' ? 'Demo' : 'Connected', link.kind === 'demo' ? 'info' : 'ok');
  $('#btnConnect').textContent = 'Disconnect'; $('#btnDemo').hidden = true;
  render();
}
function endSession(msg) {
  if (App.link) App.link.disconnect();
  App.link = null; App.S = null; App.st = null; Sniffer.running = false; Sniffer.frames.clear(); Sniffer.sel = null; clearInterval(Sniffer.timer);
  setPill('Not connected'); $('#btnConnect').textContent = 'Connect'; $('#btnDemo').hidden = false;
  render(); if (msg) toast(msg, true);
}
async function connectBle() {
  if (!BleLink.available()) { endSession(); return toast('Bluetooth is not available in this browser', true); }
  const link = new BleLink();
  setPill('Connecting…', 'warn');
  try {
    await link.connect(() => endSession('The gauges disconnected'));
    setPill('Pairing…', 'warn'); toast('If asked, type the 6-digit code shown on the speedometer');
    await startSession(link);
  } catch (e) { link.disconnect(); setPill('Not connected'); if (e.name !== 'NotFoundError') toast('Could not connect: ' + e.message, true); }
}
async function connectDemo() { setPill('Starting demo…', 'warn'); await startSession(new DemoLink()); }
$('#btnConnect').addEventListener('click', () => { if (App.link) endSession(); else connectBle(); });
$('#btnDemo').addEventListener('click', () => connectDemo());
render();
// the preview has no Bluetooth: open straight into the demo there so the page shows what it does
if (!BleLink.available()) connectDemo();
</script>

</html>
